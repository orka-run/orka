services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    ports:
      - "7390:7390"
    environment:
      ORKA_RELAY_DATA: /data
    volumes:
      - relay-data:/data
    networks:
      - orka-test
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:7390/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 5

  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    ports:
      - "7394:7394"
    environment:
      ORKA_HOME: /data
    volumes:
      - daemon-data:/data
    networks:
      - orka-test
    depends_on:
      relay:
        condition: service_healthy
    # Connect to relay; uses legacy token for test simplicity
    command: ["--port", "7394", "--host", "0.0.0.0", "--relay", "ws://relay:7390", "--node-id", "test-node"]

  toxiproxy:
    image: shopify/toxiproxy:latest
    ports:
      - "8474:8474"
      - "7391:7391"   # proxy for relay
      - "7395:7395"   # proxy for daemon
    networks:
      - orka-test

volumes:
  relay-data:
  daemon-data:

networks:
  orka-test:
    driver: bridge
